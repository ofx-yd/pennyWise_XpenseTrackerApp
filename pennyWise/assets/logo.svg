<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <rect width="48" height="48" rx="12" fill="#c9a84c"/>
  <rect width="48" height="48" rx="12" fill="url(#grad)"/>
  <!-- Coin circle -->
  <circle cx="24" cy="24" r="14" fill="none" stroke="#0e0e10" stroke-width="2.5"/>
  <circle cx="24" cy="24" r="10" fill="none" stroke="#0e0e10" stroke-width="1.2" stroke-dasharray="2 2"/>
  <!-- Dollar sign -->
  <text x="24" y="30" font-family="Georgia,serif" font-size="16" font-weight="700" fill="#0e0e10" text-anchor="middle">$</text>
  <!-- Shine -->
  <ellipse cx="18" cy="18" rx="4" ry="2.5" fill="rgba(255,255,255,0.28)" transform="rotate(-30 18 18)"/>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8c97a"/>
      <stop offset="100%" stop-color="#a07828"/>
    </linearGradient>
  </defs>
</svg>
